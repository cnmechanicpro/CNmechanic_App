name: CI

on:
  pull_request:
  push:
    branches: [main, claude/phase1-cloudflare-foundation]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run worker:types:check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Authenticate Supabase image pulls
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: supabase start
      - run: supabase db reset --local --no-seed
      - run: supabase test db supabase/tests --local
